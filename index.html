<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Hmm — a friendly social network." />
    <title>Hmm</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('iconnecto-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
      // Same for the layout/colour style and the first-paint background, so opening the app never flashes a different colour.
      try {
        var d = {}
        try { d = JSON.parse(localStorage.getItem('iconnecto.displayPrefs') || '{}') } catch (e) {}
        var h = document.documentElement
        if (d.minimal !== false) h.classList.add('minimal')
        if (d.layout === 'arc') h.classList.add('arc')
        if (d.look === 'obsidian') h.classList.add('obsidian')
        var th = h.dataset.theme
        var dark = th === 'dark' || (!th && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var arc = d.layout === 'arc'
        h.style.background = dark ? (arc ? '#09090a' : '#0c0c0f') : (arc ? '#f4f4f5' : '#ffffff')
        h.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <script>
      // Last-resort safety net: if the app crashes before React can show anything, never leave a blank page.
      (function () {
        function show(msg) {
          var r = document.getElementById('root')
          if (!r || (r.childNodes.length && !r.querySelector('#boot'))) return
          r.innerHTML =
            '<div style="font-family:system-ui,sans-serif;padding:24px;max-width:520px;margin:0 auto;line-height:1.5">' +
            '<h2>Hmm could not start</h2><p>Please reload the page. If it keeps happening, send this text to the developer:</p>' +
            '<pre style="white-space:pre-wrap;background:#00000012;padding:12px;border-radius:12px;font-size:12px"></pre></div>'
          r.querySelector('pre').textContent = msg
        }
        window.addEventListener('error', function (e) { setTimeout(function () { show(String(e.message || e.error)) }, 1500) })
        window.addEventListener('unhandledrejection', function (e) { setTimeout(function () { show(String(e.reason)) }, 1500) })
        setTimeout(function () { show('The app did not render within 8 seconds (no error was reported).') }, 8000)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown the instant the page opens; React replaces it as soon as the app is ready. -->
      <div id="boot" aria-hidden="true"><span></span></div>
      <style>
        #boot { position: fixed; inset: 0; display: grid; place-items: center; }
        #boot span { width: 44px; height: 44px; border-radius: 50%; border: 3px solid currentColor; border-top-color: transparent; opacity: .35; animation: boot-spin .9s linear infinite; }
        html:not([data-theme='dark']) #boot { color: #0b0b0c; }
        html[data-theme='dark'] #boot { color: #f4f4f5; }
        @media (prefers-color-scheme: dark) { html:not([data-theme='light']):not([data-theme='dark']) #boot { color: #f4f4f5; } }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
