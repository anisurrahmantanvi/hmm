name: Deploy Supabase functions
# Run manually: Actions > Deploy Supabase functions > Run workflow.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
# The function's own secrets (FCM_SERVICE_ACCOUNT, PUSH_WEBHOOK_SECRET) are set in Supabase > Edge Functions > Secrets, not here.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref (the part before .supabase.co)'
        required: true
        default: hcfehacsfirzwjqqcabb
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy send-push (called by database triggers, checked by a shared secret)
        run: supabase functions deploy send-push --no-verify-jwt --yes --project-ref "${{ inputs.project_ref }}"
      - name: Deploy purge-accounts (daily clean-up of accounts past their 30-day deletion wait)
        run: supabase functions deploy purge-accounts --no-verify-jwt --yes --project-ref "${{ inputs.project_ref }}"
      - name: Deploy log-login (records the IP of sign-ins, signed-in users only)
        run: supabase functions deploy log-login --yes --project-ref "${{ inputs.project_ref }}"
      - name: Deploy ai-chat (Hmm AI; signed-in users only, needs secret GEMINI_API_KEY)
        run: supabase functions deploy ai-chat --yes --project-ref "${{ inputs.project_ref }}"
